<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Jan Bos Uren"><title>Jan Bos Uren</title><link rel="manifest" href="/static/manifest.webmanifest"><link rel="stylesheet" href="/static/style.css?v=4"></head><body class="appbody"><div class="app-shell"><header class="simple-header"><img class="real-logo" src="/static/janbos-logo.svg?v=1" alt="Jan Bos Glas en Schilderwerken Totaalbouw"><div class="header-week">Week <strong id="weekLabel">–</strong></div></header><main class="simple-main"><section class="start-card"><h1>Uren invullen</h1><p>Vul je naam en weeknummer in.</p><div class="start-grid"><label>Naam<input id="name" placeholder="Voor- en achternaam" autocomplete="name"></label><label>Week<input id="week" type="number" min="1" max="53" inputmode="numeric"></label></div><label class="zero-row"><input id="zero" type="checkbox"><span>0-urencontract</span></label></section><section class="week-summary"><div><span>Totaal deze week</span><strong id="weekTotal">0 uur</strong></div><div id="freeStat"><span>Vrije uren</span><strong id="freeTotal">0 vrij</strong></div></section><div class="days-title"><h2>Werkdagen</h2><span>Vul alleen de dagen in waarop je gewerkt hebt</span></div><section id="days" class="day-list"></section><div id="msg" class="msg" hidden></div><div class="bottom-space"></div></main><footer class="submit-bar"><div class="submit-inner"><button id="submitBtn" class="submit" onclick="submitWeek()">Week indienen <span>→</span></button></div></footer></div><script src="/static/app.js?v=4"></script></body></html>
