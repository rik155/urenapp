<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Jan Bos Uren">
  <title>Jan Bos Uren</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png?v=1">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/icon-192.png?v=1">
  <link rel="stylesheet" href="/static/style.css?v=9">
  <link rel="stylesheet" href="/static/mobile.css?v=4">
</head>
<body class="appbody">
  <div class="app-shell">
    <header class="simple-header">
      <img class="real-logo" src="/static/janbos-logo.jpg?v=1" alt="Jan Bos Glas- en Schilderwerken">
      <div class="header-week" aria-label="Geselecteerde week">Week <strong id="weekLabel">–</strong></div>
    </header>
    <main class="app-content">
      <section class="start-card">
        <div class="section-heading">
          <span class="eyebrow">Urenregistratie</span>
          <h1>Mijn werkweek</h1>
          <p>Vul je gegevens en gewerkte uren in.</p>
        </div>
        <div class="top-fields">
          <div class="name-fields">
            <label class="big-field"><span>Naam</span><select id="employee" aria-label="Kies je naam">
              <option value="">Kies je naam</option>
              <option value="Rik">Rik</option>
              <option value="Theo Buijk">Theo Buijk</option>
              <option value="Harrie van Gemert">Harrie van Gemert</option>
              <option value="Winfried van Steen">Winfried van Steen</option>
              <option value="Dave van Steen">Dave van Steen</option>
              <option value="Theo v Steen">Theo v Steen</option>
              <option value="Germaine Mol">Germaine Mol</option>
              <option value="Mark Rees">Mark Rees</option>
              <option value="Hamid">Hamid</option>
              <option value="Niza">Niza</option>
              <option value="Pim Brock">Pim Brock</option>
              <option value="Joop Voorn">Joop Voorn</option>
              <option value="Jan Theunissen">Jan Theunissen</option>
              <option value="Milan">Milan</option>
              <option value="Paul Thijssen">Paul Thijssen</option>
              <option value="Lin de Rooij">Lin de Rooij</option>
              <option value="Peter Gress">Peter Gress</option>
              <option value="Julius">Julius</option>
              <option value="Peter Brock">Peter Brock</option>
              <option value="Menno Veldkamp">Menno Veldkamp</option>
              <option value="Johan Wouters">Johan Wouters</option>
            </select></label>
          </div>
          <label class="big-field week-field"><span>Week</span><input id="week" type="number" min="1" max="53" inputmode="numeric" aria-label="Weeknummer"></label>
        </div>
        <label class="contract-row">
          <input id="zero" type="checkbox">
          <span><strong>0-urencontract</strong><small>Toon ook vrije uren</small></span>
        </label>
      </section>
      <section class="week-summary" aria-live="polite">
        <div><span>Totaal deze week</span><strong id="weekTotal">0 uur</strong></div>
        <div id="freeStat" class="week-total"><span>Vrije uren</span><strong id="freeTotal">0 vrij</strong></div>
      </section>
      <div class="days-title">
        <div><span class="eyebrow">Per dag</span><h2>Werkdagen</h2></div>
        <p>Vul alleen dagen in waarop je gewerkt hebt.</p>
      </div>
      <section id="days" class="day-list"></section>
      <div id="msg" class="msg" hidden role="status"></div>
    </main>
    <footer class="submit-bar">
      <div class="submit-inner"><button id="submitBtn" class="submit" onclick="submitWeek()">Week indienen <span aria-hidden="true">→</span></button></div>
    </footer>
  </div>
  <script src="/static/app.js?v=8"></script>
</body>
</html>
